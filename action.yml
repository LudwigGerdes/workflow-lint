name: workflow-lint
description: Lint and format workflow JSON; ships with n8n support

inputs:
  paths:
    description: Files or directories to lint
    default: '.'
  n8n-version:
    description: n8n version to lint against; without it, version-dependent findings are withheld
    required: false
  config:
    description: Path to a workflow-lint config file
    required: false
  fail-on:
    description: Lowest severity that fails the run (info, warn, error)
    default: error
  format:
    description: stylish, json, sarif, junit or github-actions
    default: github-actions

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 24

    - shell: bash
      env:
        INPUT_PATHS: ${{ inputs.paths }}
        INPUT_N8N_VERSION: ${{ inputs.n8n-version }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_FORMAT: ${{ inputs.format }}
      run: |
        # Built as an array rather than interpolated into one string, so an
        # empty optional input cannot become a stray empty argument.
        args=(lint)
        for path in $INPUT_PATHS; do args+=("$path"); done
        args+=(--format "$INPUT_FORMAT" --fail-on "$INPUT_FAIL_ON")
        if [ -n "$INPUT_N8N_VERSION" ]; then
          args+=(--n8n-version "$INPUT_N8N_VERSION")
        fi
        if [ -n "$INPUT_CONFIG" ]; then
          args+=(--config "$INPUT_CONFIG")
        fi
        # Run the published package at the version this checkout of the action declares.
        version="$(node -p "require('$GITHUB_ACTION_PATH/packages/cli/package.json').version")"
        npx --yes "workflow-lint@$version" "${args[@]}"
